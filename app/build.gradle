plugins { id "com.android.application" }

// Release signing: keystore.properties (storeFile, storePassword, keyAlias, keyPassword) next to settings.gradle.
// It is never committed. Without it, "assembleRelease" builds an unsigned APK and "assembleDebug" still works.
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace "io.github.fpvvr"
    compileSdk 34
    defaultConfig {
        applicationId "io.github.fpvvr"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2"
    }
    signingConfigs {
        if (ksFile.exists()) {
            release {
                storeFile file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
